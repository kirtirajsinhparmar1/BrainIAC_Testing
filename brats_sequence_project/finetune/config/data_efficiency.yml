# Controlled low-data/data-efficiency study.
# The model and training values below intentionally mirror full_finetune.yml.

experiment:
  name: brats2020_brainiac_data_efficiency
  seed: 42
  fraction: 1.0

model:
  checkpoint_path: "./checkpoints/BrainIAC.ckpt"
  image_size: [96, 96, 96]
  hidden_size: 768
  num_classes: 4
  dropout: 0.2
  freeze_backbone: false

data:
  train_csv: "./brats_sequence_project/outputs/train.csv"
  val_csv: "./brats_sequence_project/outputs/val.csv"
  test_csv: "./brats_sequence_project/outputs/test.csv"
  preprocessing: "official_runtime_resize_zscore"
  batch_size: 16
  validation_batch_size: 1
  num_workers: 4
  validation_num_workers: 1
  pin_memory: false

training:
  epochs: 100
  optimizer: "Adam"
  learning_rate: 0.0001
  weight_decay: 0.0001
  scheduler: "ReduceLROnPlateau"
  scheduler_mode: "max"
  scheduler_factor: 0.1
  scheduler_patience: 10
  precision: "16-mixed"
  checkpoint_metric: "val_balanced_accuracy"
  checkpoint_mode: "max"

output:
  root_dir: "./brats_sequence_project/finetune/results/data_efficiency"

# Edit this map to add/remove planned runs. Each seed maps to one nested
# patient ordering, so every larger subset contains the smaller subset for that
# seed. The runner rejects patient/seed pairs not listed here.
data_efficiency:
  patient_counts: [1, 2, 5, 10, 25, 50, 75, 100, 150, 200, 250]
  seed_plan:
    1: [42, 123]
    2: [42, 123]
    5: [42, 123]
    10: [42, 123]
    25: [42, 123]
    50: [42, 123]
    75: [42, 123]
    100: [42, 123]
    150: [42, 123]
    200: [42, 123]
    250: [42, 123]
